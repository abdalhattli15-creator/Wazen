<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wazen — AI Workload-Balancing Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f1f3a;--navy2:#1a2d50;--ink:#16202e;--muted:#5d6b7e;--line:#e3e8ef;--bg:#f4f6f9;--card:#fff;
  --accent:#0e8a7d;--accent-d:#0b6f65;--accent-soft:#e3f4f1;
  --amber:#b7780a;--amber-soft:#fdf3dc;--red:#c8372d;--red-soft:#fbe7e5;
  --green:#2f8f4e;--green-soft:#e4f3e8;--blue:#2f5fb3;--blue-soft:#e8eefa;--violet:#6b4fbb;--violet-soft:#efeafb;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--navy);color:#cfd8e6;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px 24px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#19b3a3,#0b6f65);display:grid;place-items:center;flex:none}
.brand b{color:#fff;font-size:17px;display:block;letter-spacing:.2px}
.brand small{font-size:11px;color:#8fa0bb}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#cfd8e6;text-decoration:none;font-weight:500;white-space:nowrap}
nav a svg{width:17px;height:17px;flex:none;opacity:.85}
nav a:hover{background:var(--navy2)}
nav a.on{background:rgba(255,255,255,.1);color:#fff}
nav a .badge{margin-left:auto;background:rgba(255,255,255,.12);border-radius:10px;padding:0 7px;font-size:11px;line-height:18px}
nav a .badge.alert{background:var(--red);color:#fff}
.side-foot{margin-top:auto;font-size:11px;color:#7f8ea8;padding:8px;line-height:1.5}
main{padding:26px 30px 70px;min-width:0;max-width:1240px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.2px}
h2{font-size:15px;margin:0}
.sub{color:var(--muted);margin-top:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c5cfdc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#eef2f6}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.kpi .n{font-size:11.5px;color:var(--muted);margin-top:2px}
.two{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-over{background:var(--red-soft);color:var(--red)}
.p-high{background:var(--amber-soft);color:var(--amber)}
.p-ok{background:var(--green-soft);color:var(--green)}
.p-light{background:var(--blue-soft);color:var(--blue)}
.p-none{background:#eef1f5;color:var(--muted)}
.p-extra{background:var(--violet-soft);color:var(--violet)}
.chip{display:inline-block;background:#f0f3f7;border-radius:6px;padding:1px 7px;font-size:11.5px;color:#3d4a5c;margin:2px 3px 0 0}
.chip.match{background:var(--accent-soft);color:var(--accent-d)}
/* workload bars */
.wl{display:grid;grid-template-columns:170px 1fr 92px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f2f5}
.wl:last-child{border-bottom:0}
.wl .who b{display:block;font-weight:600;font-size:13.5px}
.wl .who span{font-size:11.5px;color:var(--muted)}
.track{position:relative;height:12px;background:#eef1f5;border-radius:6px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .5s ease}
.fill.extra{opacity:1}
.cap{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.c-over{background:var(--red)}.c-high{background:#e0a52a}.c-ok{background:var(--green)}.c-light{background:#7fa3dd}
.wl .pct{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.wl .pct small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* lists */
.alert{display:flex;gap:10px;padding:11px 12px;border-radius:10px;margin-bottom:8px;align-items:flex-start}
.alert.red{background:var(--red-soft)}.alert.amber{background:var(--amber-soft)}.alert.green{background:var(--green-soft)}.alert.blue{background:var(--blue-soft)}
.alert .t{flex:1}
.alert .t b{display:block}
.alert .t span{font-size:12.5px;color:#3d4a5c}
.log{max-height:300px;overflow:auto}
.log div{padding:7px 0;border-bottom:1px solid #f0f2f5;font-size:12.5px;display:flex;gap:10px}
.log time{color:var(--muted);flex:none;font-variant-numeric:tabular-nums;width:42px}
.log .who-tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;flex:none;height:17px;line-height:17px}
.tag-agent{background:var(--accent-soft);color:var(--accent-d)}.tag-mgr{background:#eef1f5;color:var(--muted)}.tag-ai{background:var(--violet-soft);color:var(--violet)}
/* tasks */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;font-weight:500}
.seg.on{background:var(--navy);border-color:var(--navy);color:#fff}
.task{display:grid;grid-template-columns:minmax(0,2.4fr) 1.2fr 1.3fr 150px;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}
.task .tt b{display:block;font-weight:600}
.task .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.task .why{font-size:11.5px;color:var(--muted);margin-top:5px;font-style:italic}
.task .asg b{display:block;font-weight:600;font-size:13px}
.task .asg span{font-size:11.5px;color:var(--muted)}
.task .act{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.task select{border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:#fff;font-size:12.5px}
.prio-High{color:var(--red);font-weight:600}.prio-Medium{color:var(--amber);font-weight:600}.prio-Low{color:var(--muted);font-weight:600}
.due-late{color:var(--red);font-weight:600}.due-soon{color:var(--amber);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;background:#fff}
/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.emp .hd{display:flex;gap:11px;align-items:center;margin-bottom:12px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:14px}
.emp .hd b{display:block}
.emp .hd span{font-size:12px;color:var(--muted)}
.emp .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;text-align:center}
.emp .stats div{background:#f6f8fa;border-radius:8px;padding:7px 4px}
.emp .stats b{display:block;font-size:16px}
.emp .stats span{font-size:11px;color:var(--muted)}
.emp.off{opacity:.6}
/* additional */
.rulebox{background:linear-gradient(135deg,#f3effc,#ecf6f5);border:1px solid #ddd5f3;border-radius:var(--r);padding:16px 18px;margin-bottom:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.rulebox div>b{display:block;font-size:13px;margin-bottom:2px}
.rulebox div span{font-size:12.5px;color:#3d4a5c}
.form{display:grid;grid-template-columns:2fr 1.3fr 1.2fr .7fr 1fr 1fr;gap:10px;align-items:end}
.form label,.mform label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.form input,.form select,.mform input,.mform select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
.ledger .lr{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;padding:7px 0;font-size:13px}
/* agent */
.agent{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:480px;padding:0;overflow:hidden}
.msgs{flex:1;overflow:auto;padding:18px}
.msg{max-width:88%;margin-bottom:12px;padding:10px 13px;border-radius:12px;font-size:13.5px;overflow-wrap:anywhere}
.msg.user{margin-left:auto;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.bot{background:#f3f5f8;border-bottom-left-radius:4px}
.msg.bot ul{margin:6px 0;padding-inline-start:18px;padding-left:0}
.msg.bot ul{padding-left:18px}.msg.bot[dir=rtl] ul{padding-left:0;padding-right:18px}
.msg.bot p{margin:0 0 6px}
.msg.bot p:last-child{margin:0}
.msg .tools{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.msg .tools span{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--accent-d)}
.composer{border-top:1px solid var(--line);padding:12px;background:#fff}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.quick button{flex:none;border:1px solid var(--line);background:#f8fafb;border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
.quick button:hover{border-color:var(--accent);color:var(--accent-d)}
.inrow{display:flex;gap:8px}
.inrow textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;resize:none;height:42px}
.mini .wl{grid-template-columns:1fr 54px;gap:6px 10px}
.mini .wl .track{grid-column:1/3;grid-row:2}
.notice{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:12.5px;margin:0 18px 12px}
/* method */
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.loop div{background:#f6f8fa;border-radius:10px;padding:12px;position:relative}
.loop div b{display:block;color:var(--accent-d);margin-bottom:3px}
.loop div span{font-size:12.5px;color:#3d4a5c}
.loop .num{font-size:11px;font-weight:700;color:var(--muted)}
table.f{width:100%;border-collapse:collapse;font-size:13px}
table.f td,table.f th{padding:8px 6px;border-bottom:1px solid #f0f2f5;text-align:left;vertical-align:top}
table.f th{font-size:11.5px;color:var(--muted);font-weight:600}
.set{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;margin-bottom:12px}
.set input[type=range]{width:100%;accent-color:var(--accent)}
.set output{font-weight:700;text-align:right}
code.formula{display:block;background:var(--navy);color:#d9f3ef;border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,31,58,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.scrim.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(620px,100%);max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 4px;font-size:17px}
.cand{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.cand.best{border-color:var(--accent);background:#f6fbfa}
.cand .sc{font-size:22px;font-weight:700;text-align:right;line-height:1}
.cand .sc small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.bd{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.bd span{font-size:11px;border-radius:5px;padding:1px 6px;background:#f0f3f7}
.cand ul{margin:6px 0 0;padding-left:16px;font-size:12px;color:#3d4a5c}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mform .full{grid-column:1/3}
.skillpick{display:flex;flex-wrap:wrap;gap:6px}
.skillpick label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink);font-weight:500;margin:0;cursor:pointer}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:60;font-size:13px;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
@media (max-width:1080px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .two,.agent{grid-template-columns:1fr}
  .form{grid-template-columns:1fr 1fr}
  .rulebox,.loop{grid-template-columns:1fr 1fr}
  .task{grid-template-columns:1fr 1fr}
  .task .act{justify-content:flex-start}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;height:auto;padding:12px 10px 8px;z-index:20}
  .brand{padding:0 6px 10px}
  nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px}
  nav a{padding:7px 10px;font-size:13px}
  .side-foot{display:none}
  main{padding:18px 14px 60px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:22px}
  .kpi:last-child{grid-column:1/-1}
  .wl{grid-template-columns:1fr 64px;gap:6px 10px}
  .wl .track{grid-column:1/3;grid-row:2}
  .task{grid-template-columns:1fr}
  .form,.mform{grid-template-columns:1fr}
  .mform .full{grid-column:auto}
  .rulebox,.loop{grid-template-columns:1fr}
  .ledger .lr{grid-template-columns:1fr 90px}
  .ledger .lr .track{grid-column:1/3;grid-row:2}
  .chat{height:70vh}
  .msg{max-width:95%}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 21h14"/><path d="M4 8h16"/><path d="M4 8l-2.5 6a3 3 0 0 0 5 0L4 8"/><path d="M20 8l-2.5 6a3 3 0 0 0 5 0L20 8"/></svg></div>
    <div><b>Wazen · وازن</b><small>AI Workload-Balancing Agent</small></div>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">Prototype for academic presentation.<br>Data is sample data and stays in this browser.</div>
</aside>
<main id="main"></main>
</div>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================== ICONS ============================== */
const I={
 dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
 team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16.5 14.2A5 5 0 0 1 22 19"/></svg>',
 tasks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>',
 extra:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
 agent:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4"/><circle cx="9" cy="13" r="1.3" fill="currentColor"/><circle cx="15" cy="13" r="1.3" fill="currentColor"/><path d="M1.5 12v3M22.5 12v3"/></svg>',
 method:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2Z"/><path d="M8 7h6M8 11h6"/></svg>',
 bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>',
 scale:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 21h14M4 8h16"/><path d="M4 8l-2.5 6a3 3 0 0 0 5 0L4 8M20 8l-2.5 6a3 3 0 0 0 5 0L20 8"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
 undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
 copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
 send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>'
};

/* ============================== STATE ============================== */
const SKILLS=["Financial Analysis","Budgeting","Reporting","Data Analysis","Excel Modeling","Compliance","Procurement","Data Entry","Administration","Communication"];
const COLORS=["#0e8a7d","#2f5fb3","#b7780a","#6b4fbb","#c8372d","#2f8f4e","#9a4d8b","#3c7a99"];
const KEY="wazen-agent-v1";
const uid=()=>Math.random().toString(36).slice(2,8);
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function seed(){
 const E=(id,name,role,skills,capacity)=>({id,name,role,skills,capacity,available:true});
 const T=(id,title,skill,hours,priority,due,assignee,status="To do",type="core",requestedBy="")=>({id,title,skill,hours,priority,due:addDays(due),assignee,status,type,requestedBy,reason:assignee?"Assigned manually before the agent was switched on.":""});
 return {
  employees:[
   E("e1","Aisha Al Balushi","Senior Financial Analyst",["Financial Analysis","Reporting","Budgeting","Compliance"],40),
   E("e2","Khalid Al Harthy","Budget Officer",["Budgeting","Data Entry","Compliance"],40),
   E("e3","Maryam Al Rawahi","Data Analyst",["Data Analysis","Reporting","Excel Modeling"],40),
   E("e4","Saif Al Kindi","Procurement Specialist",["Procurement","Compliance","Data Entry"],40),
   E("e5","Noor Al Lawati","Administrative Coordinator",["Administration","Data Entry","Communication"],32),
   E("e6","Yousuf Al Siyabi","Junior Analyst (Trainee)",["Financial Analysis","Data Entry","Excel Modeling"],24)
  ],

let S;

/* ============================== ENGINE ============================== */
const emp=id=>S.employees.find(e=>e.id===id);
const task=id=>S.tasks.find(t=>t.id===id);
const openTasks=eid=>S.tasks.filter(t=>t.assignee===eid&&t.status!=="Done");
const load=eid=>openTasks(eid).reduce((a,t)=>a+t.hours,0);
const extraLoad=eid=>openTasks(eid).filter(t=>t.type==="additional").reduce((a,t)=>a+t.hours,0);
const util=e=>e.capacity?load(e.id)/e.capacity:0;
function band(u){const p=u*100;if(p>S.settings.over)return"over";if(p>=S.settings.high)return"high";if(p<50)return"light";return"ok"}
const BAND_LABEL={over:"Overloaded",high:"High",ok:"Balanced",light:"Light"};
const active=()=>S.employees.filter(e=>e.available);
function teamUtil(){const a=active();const c=a.reduce((s,e)=>s+e.capacity,0);return c?a.reduce((s,e)=>s+load(e.id),0)/c:0}
function fairness(){const u=active().map(util);if(u.length<2)return 100;const m=u.reduce((a,b)=>a+b,0)/u.length;if(!m)return 100;const sd=Math.sqrt(u.reduce((a,b)=>a+(b-m)**2,0)/u.length);return Math.max(0,Math.round(100*(1-sd/m)))}

/* Score every available employee for a task. Returns ranked list with breakdown + reasons. */
function recommend(t){
 const st=S.settings;
 return active().map(e=>{
  const own=t.assignee===e.id&&t.status!=="Done"?t.hours:0;
  const base=load(e.id)-own;
  const proj=(base+t.hours)/e.capacity;
  const hasSkill=e.skills.includes(t.skill);
  const skillPts=hasSkill?(t.priority==="High"?45:35):0;
  const headPts=Math.max(0,Math.min(1,1-proj))*40;
  let fairPts,extraOk=true;const reasons=[];
  if(t.type==="additional"){
   const ex=extraLoad(e.id)-(t.type==="additional"?own:0);
   const capH=e.capacity*st.extraCap/100;
   extraOk=ex+t.hours<=capH+1e-9;
   fairPts=15*(1-Math.min(ex/Math.max(capH,1),1));
   reasons.push(`Additional work carried: ${ex}h of ${round1(capH)}h allowance`);
  }else{
   const n=openTasks(e.id).filter(x=>x.id!==t.id).length;
   fairPts=15*(1-Math.min(n/8,1));
   reasons.push(`${n} open task${n===1?"":"s"} already`);
  }
  let penalty=0;
  if(proj*100>st.over){penalty-=100;reasons.unshift(`Would reach ${pct(proj)} — above capacity`)}
  else reasons.unshift(`Would be at ${pct(proj)} after assignment`);
  if(proj*100>st.high&&proj*100<=st.over){penalty-=15;reasons.push(`Above the ${st.high}% high-load threshold`)}
  if(!extraOk){penalty-=40;reasons.push("Exceeds the additional-task allowance")}
  reasons.splice(1,0,hasSkill?`Has the required skill (${t.skill})`:`Lacks ${t.skill} — would need support`);
  const score=Math.round(skillPts+headPts+fairPts+penalty);
  const eligible=proj*100<=st.over&&extraOk;
  return {e,score,display:Math.max(0,score),proj,hasSkill,eligible,parts:{skill:Math.round(skillPts),headroom:Math.round(headPts),fairness:Math.round(fairPts),penalty},reasons};
 }).sort((a,b)=>b.score-a.score||a.proj-b.proj);
}
function assign(tid,eid,reason,who="agent"){
 const t=task(tid),e=emp(eid);if(!t||!e)return false;
 const from=t.assignee?emp(t.assignee):null;
 t.assignee=eid;t.reason=reason||"";
 log(who,from&&from.id!==eid?`Moved “${t.title}” (${t.hours}h) from ${first(from)} to ${first(e)}. ${reason||""}`:`Assigned “${t.title}” (${t.hours}h) to ${first(e)}. ${reason||""}`);
 return true;
}
function reasonFrom(r){return `${r.hasSkill?"Skill match":"Best available (no exact skill match)"}; ${first(r.e)} will be at ${pct(r.proj)}.`}
/* Assign every unassigned task: highest priority + earliest deadline first. Escalates when nobody has room. */
function autoAssign(type){
 const order={High:0,Medium:1,Low:2};
 const list=S.tasks.filter(t=>!t.assignee&&t.status!=="Done"&&(!type||t.type===type)).sort((a,b)=>order[a.priority]-order[b.priority]||a.due.localeCompare(b.due));
 const done=[],escalated=[];
 for(const t of list){
  const r=recommend(t).find(x=>x.eligible);
  if(r){assign(t.id,r.e.id,reasonFrom(r));done.push({task:t.title,to:r.e.name,util_after:pct(r.proj)})}
  else{escalated.push(t.title);log("agent",`Escalated “${t.title}”: no employee has capacity. Manager decision needed (extend deadline, split, or add temporary help).`)}
 }
 return {assigned:done,escalated};
}
/* Move movable ("To do") tasks away from anyone above the High threshold, to skilled colleagues with room. */
function rebalanceCore(){
 const st=S.settings,moves=[];
 for(let guard=0;guard<40;guard++){
  let moved=false;
  const ranked=active().sort((a,b)=>util(b)-util(a));
  outer: for(const src of ranked){
   if(util(src)*100<=st.high)break;
   const srcU=util(src);
   const cands=openTasks(src.id).filter(t=>t.status==="To do").sort((a,b)=>b.hours-a.hours);
   for(const t of cands){
    const targets=active().filter(e=>e.id!==src.id&&e.skills.includes(t.skill)).map(e=>{
      const proj=(load(e.id)+t.hours)/e.capacity;
      const extraOk=t.type!=="additional"||extraLoad(e.id)+t.hours<=e.capacity*st.extraCap/100;
      return {e,proj,extraOk};
     }).filter(x=>x.extraOk&&x.proj<srcU-0.02&&(x.proj*100<=st.high||(srcU*100>st.over&&x.proj*100<=st.over))).sort((a,b)=>a.proj-b.proj);
    if(targets.length){
     const tg=targets[0];
     const before=pct(srcU);
     assign(t.id,tg.e.id,`Rebalanced: ${first(src)} was at ${before}; ${first(tg.e)} has the skill and will be at ${pct(tg.proj)}.`);
     moves.push({task:t.title,hours:t.hours,from:src.name,to:tg.e.name,from_util_before:before,from_util_after:pct(util(src)),to_util_after:pct(tg.proj)});
     moved=true;break outer;
    }
   }
  }
  if(!moved)break;
 }
 return moves;
}

function md(s){
 const lines=esc(s).split("\n");let out="",inList=false;
 for(let l of lines){
  l=l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const m=l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
  if(m){if(!inList){out+="<ul>";inList=true}out+=`<li>${m[1]}</li>`}
  else{if(inList){out+="</ul>";inList=false}if(l.trim())out+=`<p>${l.replace(/^#+\s*/,"")}</p>`}
 }
 return out+(inList?"</ul>":"");
}

const AR_NAMES={"عائشة":"aisha","عايشة":"aisha","خالد":"khalid","مريم":"maryam","سيف":"saif","نور":"noor","يوسف":"yousuf"};

  tool("create_task");

  if(r){tool("assign_task");assign(t.id,r.e.id,reasonFrom(r),"ai");
   const alt=recs.filter(x=>x!==r).slice(0,2).map(x=>`${first(x.e)} (${x.eligible?pct(x.proj):L("not eligible","غير مؤهل")})`).join(", ");
   return L(`Created ${t.type==="additional"?"an **additional**":"a"} task **${t.title}** (${t.skill}, ${t.hours}h, due ${fmtDate(t.due)}).\n- Assigned to **${r.e.name}** — score ${r.display}\n- ${r.reasons.join("\n- ")}\n- Runners-up: ${alt}`,
    `تم إنشاء ${t.type==="additional"?"مهمة **إضافية**":"مهمة"} **${t.title}** (${t.skill}، ${t.hours} ساعات، الموعد ${fmtDate(t.due)}).\n- أُسندت إلى **${r.e.name}** — النتيجة ${r.display}\n- سيصل حمله إلى ${pct(r.proj)}${r.hasSkill?" ولديه المهارة المطلوبة":""}\n- البدائل: ${alt}`);
  }
  log("agent",`Escalated “${t.title}”: no employee has capacity.`);
  return L(`Created **${t.title}**, but nobody can take ${t.hours}h without going above ${st.over}%.\nOptions: extend the deadline, split the task, or bring in temporary help.`,`تم إنشاء **${t.title}** لكن لا يوجد موظف يستطيع أخذ ${t.hours} ساعات دون تجاوز ${st.over}%.\nالخيارات: تمديد الموعد، تقسيم المهمة، أو دعم مؤقت.`);
 }
 // rebalance
 if(!/unassigned|غير مسند|غير المسند/.test(low)&&/rebalanc|balance|redistribut|وازن|توازن|توزيع|التوزيع/.test(low)){
  tool("rebalance_workload");const f0=fairness();snapshot();const m=rebalanceCore();
  if(!m.length){history.pop();return L(`The team is already as balanced as the rules allow (fairness ${f0}/100). Nobody above ${st.high}% has a To-do task that a skilled colleague can absorb.`,`الفريق متوازن قدر ما تسمح القواعد (مؤشر العدالة ${f0}/100).`)}
  return L(`Rebalanced the team — fairness **${f0} → ${fairness()}**.\n${m.map(x=>`- **${x.task}** (${x.hours}h): ${x.from.split(" ")[0]} ${x.from_util_before} → ${x.from_util_after}; ${x.to.split(" ")[0]} now ${x.to_util_after}`).join("\n")}\n\nIn-progress work was not moved. Press **Undo** to reverse.`,
   `تمت إعادة موازنة الفريق — مؤشر العدالة **${f0} ← ${fairness()}**.\n${m.map(x=>`- **${x.task}** (${x.hours} س): من ${x.from.split(" ")[0]} إلى ${x.to.split(" ")[0]} — ${x.from.split(" ")[0]} انخفض من ${x.from_util_before} إلى ${x.from_util_after}`).join("\n")}\n\nلم تُنقل المهام قيد التنفيذ. اضغط **Undo** للتراجع.`);
 }
 // assign all
 if(/assign|unassigned|وزّع|وزع|أسند|اسند|غير مسند/.test(low)){
  tool("auto_assign_unassigned");snapshot();const r=autoAssign(/additional|extra|إضاف|اضاف/.test(low)?"additional":undefined);
  if(!r.assigned.length&&!r.escalated.length){history.pop();return L("Every task already has an owner.","جميع المهام مسندة بالفعل.")}
  return L(`Assigned ${r.assigned.length} task(s), highest priority first:\n${r.assigned.map(a=>`- **${a.task}** → ${a.to.split(" ")[0]} (now ${a.util_after})`).join("\n")}`+(r.escalated.length?`\n\n⚠ Escalated (no capacity): ${r.escalated.join(", ")}`:""),
   `تم إسناد ${r.assigned.length} مهمة حسب الأولوية:\n${r.assigned.map(a=>`- **${a.task}** ← ${a.to.split(" ")[0]} (الحمل الآن ${a.util_after})`).join("\n")}`+(r.escalated.length?`\n\n⚠ تم رفعها للمدير (لا توجد سعة): ${r.escalated.join("، ")}`:""));
 }
 tool("get_team_status");
 const a=active().sort((x,y)=>util(y)-util(x));
 // overloaded
 if(/overload|busy|most|highest|pressure|مضغوط|ضغط|أكثر|اكثر|محمل/.test(low)){
  const over=a.filter(e=>band(util(e))==="over"),high=a.filter(e=>band(util(e))==="high");
  if(!over.length&&!high.length)return L(`Nobody is overloaded. Highest load: ${statusLine(a[0],ar)}.`,`لا يوجد موظف مضغوط. أعلى حمل: ${statusLine(a[0],ar)}.`);
  const why=e=>openTasks(e.id).sort((x,y)=>y.hours-x.hours).slice(0,3).map(t=>`${t.title} ${t.hours}h`).join(", ");
  return L(`${over.length?`**Overloaded (>${st.over}%):**\n${over.map(e=>`- ${statusLine(e)} — biggest items: ${why(e)}`).join("\n")}`:""}${high.length?`\n\n**Near capacity (${st.high}–${st.over}%):**\n${high.map(e=>"- "+statusLine(e)).join("\n")}`:""}\n\nSay **"rebalance the team"** and I'll move To-do work to colleagues with room.`,
   `${over.length?`**تجاوزوا الطاقة (>${st.over}%):**\n${over.map(e=>`- ${statusLine(e,true)}`).join("\n")}`:""}${high.length?`\n\n**قريبون من الحد (${st.high}–${st.over}%):**\n${high.map(e=>"- "+statusLine(e,true)).join("\n")}`:""}\n\nاكتب **"أعد توزيع المهام"** وسأنقل المهام لزملاء لديهم سعة.`);
 }
 // least loaded / who can take
 if(/least|lowest|free|room|who can|available|أقل|اقل|متاح|فاضي|من يستطيع|مين/.test(low)){
  const skill=/skill|مهار/.test(low)||findSkill(text)!=="Reporting"||/report|تقرير/.test(low)?findSkill(text):null;
  const pool=a.filter(e=>!skill||e.skills.includes(skill)).sort((x,y)=>util(x)-util(y)).slice(0,3);
  return L(`Most room${skill?` among people with **${skill}**`:""}:\n${pool.map(e=>`- ${statusLine(e)} — ${e.capacity-load(e.id)}h free`).join("\n")}`,`أكثر الموظفين سعة${skill?` ممن لديهم مهارة **${skill}**`:""}:\n${pool.map(e=>`- ${statusLine(e,true)} — متاح ${e.capacity-load(e.id)} ساعة`).join("\n")}`);
 }
 // default summary
 const un=S.tasks.filter(t=>!t.assignee&&t.status!=="Done").length;
 return L(`**Team snapshot** — utilization ${pct(teamUtil())}, fairness ${fairness()}/100, ${un} unassigned.\n${a.map(e=>`- ${statusLine(e)} · ${BAND_LABEL[band(util(e))]}`).join("\n")}\n\nYou can ask me to: assign all unassigned tasks · rebalance the team · say who is overloaded · mark someone on leave · add a new (additional) task.`,
  `**ملخص الفريق** — الاستغلال ${pct(teamUtil())}، العدالة ${fairness()}/100، ${un} مهام غير مسندة.\n${a.map(e=>`- ${statusLine(e,true)}`).join("\n")}\n\nيمكنك أن تطلب: إسناد المهام غير المسندة · إعادة توزيع المهام · من الأكثر ضغطًا · تسجيل موظف في إجازة · إضافة مهمة إضافية.`);
}
async function sendLocal(text){
 chat.push({role:"user",content:text});const turn={role:"assistant",content:"",tools:[]};chat.push(turn);busy=true;renderMsgs();
 await new Promise(r=>setTimeout(r,450));
 let out;try{out=localAgent(text,turn)}catch(e){out="Sorry — I couldn't process that. Try one of the suggestions."}
 turn.content="";renderMsgs();
 const words=out.split(/(\s+)/);for(let i=0;i<words.length;i+=6){turn.content=words.slice(0,i+6).join("");const live=document.querySelector("#live .body");if(live)live.innerHTML=md(turn.content);await new Promise(r=>setTimeout(r,22))}
 turn.content=out;busy=false;renderMsgs();refresh();
}

/* ============================== MODALS & FORMS ============================== */
function openModal(html){document.getElementById("modal").innerHTML=html;document.getElementById("scrim").classList.add("on")}
function closeModal(){document.getElementById("scrim").classList.remove("on")}
document.getElementById("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeModal()});
function recModal(tid){
 const t=task(tid);const recs=recommend(t);const bestIdx=recs.findIndex(r=>r.eligible);
 openModal(`<h3>${t.assignee?"Reassign":"Assign"}: ${esc(t.title)}</h3><div class="sub">${esc(t.skill)} · ${t.hours}h · <span class="prio-${t.priority}">${t.priority}</span> · due ${fmtDate(t.due)}${t.type==="additional"?" · Additional task":""}</div>
 ${bestIdx<0?`<div class="alert red" style="margin-top:12px"><div class="t"><b>No one has enough capacity</b><span>Recommendation: extend the deadline, split the task, or bring in temporary help. You can still assign manually.</span></div></div>`:""}
 ${recs.map((r,i)=>`<div class="cand ${i===bestIdx?"best":""}"><div><div class="row"><b>${esc(r.e.name)}</b>${i===bestIdx?'<span class="pill p-ok">Agent pick</span>':""}${!r.eligible?'<span class="pill p-over">Not eligible</span>':""}${t.assignee===r.e.id?'<span class="pill p-none">Current</span>':""}</div>
  <div class="bd"><span>Skill +${r.parts.skill}</span><span>Headroom +${r.parts.headroom}</span><span>Fairness +${r.parts.fairness}</span>${r.parts.penalty?`<span style="background:var(--red-soft);color:var(--red)">Penalty ${r.parts.penalty}</span>`:""}</div>
  <ul>${r.reasons.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <div><div class="sc">${r.display}<small>score</small></div>${t.assignee===r.e.id?"":`<button class="btn sm ${i===bestIdx?"primary":""}" style="margin-top:8px" data-act="pick" data-t="${t.id}" data-e="${r.e.id}">Assign</button>`}</div></div>`).join("")}
 ${t.assignee?`<div class="mfoot"><button class="btn" data-act="unassign" data-id="${t.id}">Unassign</button><button class="btn" data-act="close">Close</button></div>`:`<div class="mfoot"><button class="btn" data-act="close">Close</button></div>`}`);
}
function empModal(id){
 const e=id?emp(id):{name:"",role:"",skills:[],capacity:40};
 openModal(`<h3>${id?"Edit employee":"Add employee"}</h3><form class="mform" id="eform" data-id="${id||""}">
  <div><label>Full name</label><input name="name" required value="${esc(e.name)}"></div>
  <div><label>Role</label><input name="role" required value="${esc(e.role)}"></div>
  <div><label>Weekly capacity (hours)</label><input name="cap" type="number" min="1" max="60" required value="${e.capacity}"></div>
  <div></div>
  <div class="full"><label>Skills</label><div class="skillpick">${SKILLS.map(s=>`<label><input type="checkbox" name="sk" value="${s}" ${e.skills.includes(s)?"checked":""}>${s}</label>`).join("")}</div></div>
  <div class="full mfoot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>`);
}
function taskModal(type){
 openModal(`<h3>New ${type==="additional"?"additional":"core"} task</h3><form class="mform" id="tform" data-type="${type}">
  <div class="full"><label>Title</label><input name="title" required></div>
  <div><label>Skill needed</label><select name="skill">${SKILLS.map(s=>`<option>${s}</option>`).join("")}</select></div>
  <div><label>Estimated hours</label><input name="hours" type="number" min="0.5" step="0.5" value="6" required></div>
  <div><label>Priority</label><select name="prio"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
  <div><label>Due date</label><input name="due" type="date" value="${addDays(7)}" required></div>
  <div class="full mfoot"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn" name="mode" value="add">Add only</button><button type="submit" class="btn primary" name="mode" value="assign">Add &amp; auto-assign</button></div></form>`);
}
function confirmModal(msg,onYes){openModal(`<h3>Please confirm</h3><p>${msg}</p><div class="mfoot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="yes">Confirm</button></div>`);document.getElementById("yes").onclick=()=>{closeModal();onYes()}}
function newTaskFrom(fd,type){return {id:(type==="additional"?"a":"t")+uid(),title:fd.get("title").trim(),skill:fd.get("skill"),hours:Math.max(0.5,+fd.get("hours")||1),priority:fd.get("prio"),due:fd.get("due")||addDays(3),assignee:null,status:"To do",type,requestedBy:(fd.get("req")||"").trim(),reason:""}}
function autoOne(t){const r=recommend(t).find(x=>x.eligible);if(r){assign(t.id,r.e.id,reasonFrom(r));toast(`Assigned to ${r.e.name} (${pct(r.proj)})`)}else{log("agent",`Escalated “${t.title}”: no employee has capacity.`);toast("No one has capacity — escalated to manager")}}

function reportText(){
 const a=active();const lines=[`WAZEN — WORKLOAD REPORT (${new Date().toLocaleDateString("en-GB")})`,`Team utilization: ${pct(teamUtil())} · Fairness score: ${fairness()}/100`,""];
 S.employees.forEach(e=>lines.push(`• ${e.name} (${e.role}): ${e.available?pct(util(e))+" — "+BAND_LABEL[band(util(e))]:"On leave"} · ${load(e.id)}/${e.capacity}h · additional ${extraLoad(e.id)}h`));
 const un=S.tasks.filter(t=>!t.assignee&&t.status!=="Done");lines.push("",`Unassigned tasks: ${un.length?un.map(t=>t.title).join("; "):"none"}`);
 lines.push(`Open additional tasks: ${S.tasks.filter(t=>t.type==="additional"&&t.status!=="Done").length}`);
 return lines.join("\n");
}

/* ============================== EVENTS ============================== */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(b.tagName==="SELECT")return;
 switch(a){
  case "close":closeModal();break;
  case "undo":undo();break;
  case "rebalance":{snapshot();const m=rebalanceCore();if(!m.length){history.pop();toast("Already balanced — no beneficial moves");log("agent","Rebalance checked: no beneficial moves available.")}else toast(`${m.length} task${m.length>1?"s":""} moved · fairness ${fairness()}`);refresh();break}
  case "autoall":case "autocore":case "autoextra":{snapshot();const r=autoAssign(a==="autocore"?"core":a==="autoextra"?"additional":undefined);toast(`${r.assigned.length} assigned${r.escalated.length?` · ${r.escalated.length} escalated`:""}`);refresh();break}
  case "rec":recModal(id);break;
  case "pick":snapshot();{const r=recommend(task(b.dataset.t)).find(x=>x.e.id===b.dataset.e);assign(b.dataset.t,b.dataset.e,r?reasonFrom(r):"",r&&!r.eligible?"mgr":"mgr")}closeModal();refresh();toast("Assigned");break;
  case "unassign":snapshot();{const t=task(id);log("mgr",`Unassigned “${t.title}”.`);t.assignee=null;t.reason=""}closeModal();refresh();break;
  case "deltask":{const t=task(id);confirmModal(`Delete “${esc(t.title)}”?`,()=>{snapshot();S.tasks=S.tasks.filter(x=>x.id!==id);log("mgr",`Deleted task “${t.title}”.`);refresh()});break}
  case "filter":taskFilter=b.dataset.f;render();break;
  case "addtask":taskModal(b.dataset.type||"core");break;
  case "addemp":empModal();break;
  case "editemp":empModal(id);break;
  case "leave":{snapshot();const x=emp(id);x.available=!x.available;log("mgr",`${x.name} marked ${x.available?"available":"on leave"}.`);refresh();if(!x.available&&openTasks(id).some(t=>t.status==="To do"))toast("Tip: ask the AI agent to redistribute their To-do tasks");break}
  case "delemp":{const x=emp(id);confirmModal(`Remove ${esc(x.name)}? Their open tasks will become unassigned.`,()=>{snapshot();S.tasks.forEach(t=>{if(t.assignee===id){t.assignee=null;t.reason=""}});S.employees=S.employees.filter(y=>y.id!==id);log("mgr",`Removed ${x.name}; their tasks returned to the unassigned pool.`);refresh()});break}
  case "xonly":{const f=document.getElementById("xform");if(!f.reportValidity())break;snapshot();const t=newTaskFrom(new FormData(f),"additional");S.tasks.push(t);log("mgr",`Logged additional task “${t.title}” (${t.hours}h)${t.requestedBy?" requested by "+t.requestedBy:""}.`);refresh();toast("Additional task added");break}
  case "report":{const txt=reportText();try{navigator.clipboard.writeText(txt).then(()=>toast("Report copied to clipboard"),()=>openModal(`<h3>Workload report</h3><pre style="white-space:pre-wrap;font-size:12.5px">${esc(txt)}</pre><div class="mfoot"><button class="btn" data-act="close">Close</button></div>`))}catch(err){openModal(`<h3>Workload report</h3><pre style="white-space:pre-wrap;font-size:12.5px">${esc(txt)}</pre><div class="mfoot"><button class="btn" data-act="close">Close</button></div>`)}break}
  case "reset":confirmModal("Reset to the original sample department? Your changes will be lost.",()=>{S=seed();history.length=0;chat=[];refresh();render();toast("Sample data restored")});break;
  case "quick":send(b.dataset.q);break;
  case "send":send(document.getElementById("cin").value);break;
  case "clearchat":if(abortCtl&&busy)abortCtl.abort();chat=[];busy=false;renderMsgs();break;
 }
});
document.addEventListener("change",e=>{
 const s=e.target;
 if(s.dataset.act==="status"){snapshot();const t=task(s.dataset.id);t.status=s.value;log("mgr",`“${t.title}” marked ${s.value}.`);refresh()}
 if(s.dataset.set){S.settings[s.dataset.set]=+s.value;if(S.settings.high>=S.settings.over)S.settings.high=S.settings.over-5;log("mgr",`Setting changed: ${s.dataset.set} = ${s.value}%.`);refresh()}
});
document.addEventListener("input",e=>{const s=e.target;if(s.dataset.set){const o=s.closest(".set").querySelector("output");o.textContent=s.value+"%"}});
document.addEventListener("submit",e=>{
 e.preventDefault();const f=e.target,fd=new FormData(f);
 if(f.id==="eform"){
  const skills=fd.getAll("sk");if(!skills.length){toast("Pick at least one skill");return}
  snapshot();const id=f.dataset.id;
  if(id){const x=emp(id);Object.assign(x,{name:fd.get("name").trim(),role:fd.get("role").trim(),capacity:+fd.get("cap"),skills});log("mgr",`Updated ${x.name}'s profile.`)}
  else{const x={id:"e"+uid(),name:fd.get("name").trim(),role:fd.get("role").trim(),capacity:+fd.get("cap"),skills,available:true};S.employees.push(x);log("mgr",`Added ${x.name} (${x.capacity}h/week).`)}
  closeModal();refresh();
 }
 if(f.id==="tform"){
  const mode=e.submitter?e.submitter.value:"add";snapshot();const t=newTaskFrom(fd,f.dataset.type);S.tasks.push(t);log("mgr",`Created task “${t.title}” (${t.hours}h).`);closeModal();
  if(mode==="assign")autoOne(t);refresh();
 }
 if(f.id==="xform"){
  snapshot();const t=newTaskFrom(fd,"additional");S.tasks.push(t);log("mgr",`Logged additional task “${t.title}” (${t.hours}h)${t.requestedBy?" requested by "+t.requestedBy:""}.`);autoOne(t);refresh();
 }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
</script>
